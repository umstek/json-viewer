name: Publish

on:
  release:
    types:
      - created

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Vite+ (Node, pnpm, dependency cache)
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: '24'
          cache: true
      - name: Install dependencies
        run: vp install
      - name: Build
        run: vp run build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifact
          path: dist

  publish-npm:
    env:
      NPM_CONFIG_TOKEN: ${{secrets.npm_token}}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Vite+ (Node, pnpm, dependency cache)
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: '24'
          cache: true
      - name: Set tokens
        run: echo "//registry.npmjs.org/:_authToken=${{env.NPM_CONFIG_TOKEN}}" >> ~/.npmrc
      - name: Install dependencies
        run: vp install
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifact
          path: dist
      - name: Publish
        # Release checkouts are detached HEADs, which pnpm's default
        # branch/tree git checks would reject.
        run: pnpm publish --access public --no-git-checks

  publish-gpr:
    env:
      NPM_CONFIG_TOKEN: ${{secrets.GITHUB_TOKEN}}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Setup Vite+ (Node, pnpm, dependency cache)
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: '24'
          cache: true
      - name: Set tokens
        run: |
          echo "registry=https://npm.pkg.github.com" >> ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${{env.NPM_CONFIG_TOKEN}}" >> ~/.npmrc
      - name: Install dependencies
        run: vp install
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifact
          path: dist
      - name: Publish
        # Release checkouts are detached HEADs, which pnpm's default
        # branch/tree git checks would reject.
        run: pnpm publish --access public --no-git-checks
